<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07061a">
  <title>Кристалл: не разбей!</title>
  <link rel="stylesheet" href="style.css">
  <!-- SDK Яндекс Игр (на платформе доступен по относительному пути) -->
  <script src="/sdk.js" async onload="window.__ysdkLoaded && window.__ysdkLoaded()"></script>
</head>
<body>
  <div id="app">
    <header class="stats">
      <div class="stat">
        <span class="stat-label">Осколки</span>
        <span class="stat-value" id="shards">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Размер</span>
        <span class="stat-value" id="size">1</span>
      </div>
      <div class="stat">
        <span class="stat-label">Рекорд</span>
        <span class="stat-value" id="record">1</span>
      </div>
    </header>

    <main class="stage" id="stage">
      <canvas id="game"></canvas>
      <div class="crystal-name" id="crystalName"></div>
      <div class="hint" id="hint">Тапай по кристаллу в момент вспышки!</div>
    </main>

    <footer class="controls">
      <div class="crack-bar-wrap">
        <div class="crack-bar-label">
          <span>Трещины</span>
          <span id="crackPct">0%</span>
        </div>
        <div class="crack-bar">
          <div class="crack-fill" id="crackFill"></div>
        </div>
      </div>
      <div class="actions">
        <button class="sell-btn" id="sellBtn" type="button">
          <span class="sell-title">Продать</span>
          <span class="sell-value" id="sellValue">+1 ◆</span>
        </button>
        <button class="shop-btn" id="shopBtn" type="button" aria-label="Магазин">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16l-1.4 11.2A2 2 0 0 1 16.6 20H7.4a2 2 0 0 1-2-1.8L4 7Z"/><path d="M9 7V5.5a3 3 0 0 1 6 0V7"/></svg>
          <span>Магазин</span>
          <i class="shop-dot" id="shopDot"></i>
        </button>
      </div>
    </footer>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head" id="sheetHead">
      <div class="sheet-handle"></div>
      <div class="sheet-title-row">
        <h2 id="sheetTitle">Магазин</h2>
        <div class="sheet-balance"><span id="shopShards">0</span> ◆</div>
        <button class="sheet-close" id="sheetClose" type="button" aria-label="Закрыть">✕</button>
      </div>
    </div>
    <div class="sheet-body" id="sheetBody">
      <h3 class="shop-section">Улучшения</h3>
      <div class="shop-list" id="upgradeList"></div>
      <h3 class="shop-section">Кристаллы</h3>
      <div class="shop-list" id="crystalList"></div>
    </div>
  </section>

  <script src="game.js"></script>
</body>
</html>
